  <g class="dot" data-zone="balanced">
    <title>jpa: I = 0.75, A = 0.00, D = 0.25, 3 classes
metrics: I = 0.75, A = 0.00, D = 0.25, 3 classes</title>
    <line x1="482" y1="592" x2="478" y2="563.94" class="leader"/>
    <circle cx="482" cy="592" r="10.06" class="balanced ring" fill-opacity="0.9" stroke-width="2"/>
