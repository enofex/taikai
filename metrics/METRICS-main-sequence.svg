<svg xmlns="http://www.w3.org/2000/svg" width="644" height="670" viewBox="0 0 644 670" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title>Abstractness and instability of the packages</title>
  <style>
  .card { fill: #ffffff; stroke: #e1e0d9; }
  .plane { fill: #f7f7f5; }
  .ink { fill: #0b0b0b; }
  .ink-2 { fill: #52514e; }
  .muted { fill: #898781; }
  .grid { stroke: #e6e5df; }
  .sequence { stroke: #52514e; }
  .leader { stroke: #b4b3ac; }
  .halo { paint-order: stroke; stroke: #f7f7f5; stroke-width: 3px; stroke-linejoin: round; }
  .ring { stroke: #f7f7f5; }
  .node { fill: #ffffff; stroke: #d9d8d1; }
  .edge { fill: none; stroke: #898781; stroke-opacity: 0.75; }
  .cycle { fill: none; stroke: #d03b3b; }
  .unstable { fill: none; stroke: #c98500; }
  .edge-head { fill: #898781; }
  .cycle-head { fill: #d03b3b; }
  .unstable-head { fill: #c98500; }
  .balanced { fill: #2a78d6; }
  .pain { fill: #d03b3b; }
  .uselessness { fill: #c98500; }
  .isolated { fill: #898781; }
  .on-fill { fill: #ffffff; }
  .cell { fill: #f7f7f5; }
  .self { fill: #e6e5df; }
  .dependency { fill: #2a78d6; }
  .closing { fill: #f7d4d4; stroke: #d03b3b; }
  .unstable-target { fill: #f4e7cc; stroke: #c98500; }
  .group { fill: none; stroke: #d03b3b; }
  </style>
  <rect x="0.5" y="0.5" width="643" height="669" rx="12" class="card"/>
  <text x="24" y="40" class="ink" font-size="15" font-weight="600">Main sequence</text>
  <circle cx="281.8" cy="36" r="5" class="balanced"/>
  <text x="290.8" y="40" text-anchor="start" class="ink-2">Balanced</text>
  <circle cx="368.2" cy="36" r="5" class="pain"/>
  <text x="377.2" y="40" text-anchor="start" class="ink-2">Zone of pain</text>
  <circle cx="481.8" cy="36" r="5" class="uselessness"/>
  <text x="490.8" y="40" text-anchor="start" class="ink-2">Zone of uselessness</text>
  <defs>
    <clipPath id="plot"><rect x="92" y="72" width="520" height="520" rx="8"/></clipPath>
    <linearGradient id="pain-area" gradientUnits="userSpaceOnUse" x1="92" y1="592" x2="222" y2="462"><stop offset="0" stop-color="#d03b3b" stop-opacity="0.24"/><stop offset="1" stop-color="#d03b3b" stop-opacity="0.05"/></linearGradient>
    <linearGradient id="uselessness-area" gradientUnits="userSpaceOnUse" x1="612" y1="72" x2="482" y2="202"><stop offset="0" stop-color="#c98500" stop-opacity="0.24"/><stop offset="1" stop-color="#c98500" stop-opacity="0.05"/></linearGradient>
  </defs>
  <rect x="92" y="72" width="520" height="520" rx="8" class="plane"/>
  <g clip-path="url(#plot)">
    <polygon points="92,592 352,592 92,332" fill="url(#pain-area)"/>
    <polygon points="612,72 352,72 612,332" fill="url(#uselessness-area)"/>
    <line x1="222" y1="592" x2="222" y2="72" class="grid"/>
    <line x1="92" y1="462" x2="612" y2="462" class="grid"/>
    <line x1="352" y1="592" x2="352" y2="72" class="grid"/>
    <line x1="92" y1="332" x2="612" y2="332" class="grid"/>
    <line x1="482" y1="592" x2="482" y2="72" class="grid"/>
    <line x1="92" y1="202" x2="612" y2="202" class="grid"/>
    <line x1="92" y1="72" x2="612" y2="592" class="sequence" stroke-width="1.5" stroke-dasharray="6 5"/>
  </g>
  <text x="102.4" y="571.2" text-anchor="start" class="ink-2">Zone of pain</text>
  <text x="601.6" y="98" text-anchor="end" class="ink-2">Zone of uselessness</text>
  <text x="287.2" y="251.2" text-anchor="middle" class="ink-2 halo" transform="rotate(45 287.2 251.2)">Main sequence</text>
  <text x="92" y="622" text-anchor="middle" class="muted">0</text>
  <text x="72" y="596" text-anchor="end" class="muted">0</text>
  <text x="222" y="622" text-anchor="middle" class="muted">0.25</text>
  <text x="72" y="466" text-anchor="end" class="muted">0.25</text>
  <text x="352" y="622" text-anchor="middle" class="muted">0.5</text>
  <text x="72" y="336" text-anchor="end" class="muted">0.5</text>
  <text x="482" y="622" text-anchor="middle" class="muted">0.75</text>
  <text x="72" y="206" text-anchor="end" class="muted">0.75</text>
  <text x="612" y="622" text-anchor="middle" class="muted">1</text>
  <text x="72" y="76" text-anchor="end" class="muted">1</text>
  <text x="92" y="646" text-anchor="start" class="muted">← stable</text>
  <text x="352" y="646" text-anchor="middle" class="ink-2">Instability (I)</text>
  <text x="612" y="646" text-anchor="end" class="muted">unstable →</text>
  <text x="34" y="592" text-anchor="start" class="muted" transform="rotate(-90 34 592)">← concrete</text>
  <text x="34" y="332" text-anchor="middle" class="ink-2" transform="rotate(-90 34 332)">Abstractness (A)</text>
  <text x="34" y="72" text-anchor="end" class="muted" transform="rotate(-90 34 72)">abstract →</text>
